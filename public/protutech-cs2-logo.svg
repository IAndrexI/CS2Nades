<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#171226" />
    </linearGradient>
    <linearGradient id="cs2Gold" x1="28" y1="22" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="icePeak" x1="40" y1="18" x2="88" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Rounded Cosmic Frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#cs2Gold)" stroke-width="2.5" stroke-opacity="0.7" />
  <!-- Subtle Starlight Accents -->
  <circle cx="24" cy="24" r="1.4" fill="#e2e8f0" opacity="0.8" />
  <circle cx="104" cy="26" r="1.1" fill="#38bdf8" opacity="0.75" />
  <circle cx="96" cy="98" r="1.3" fill="#fbbf24" opacity="0.7" />

  <!-- Protutech 'P' Silhouette with Mountain Peak Crown -->
  <path
    d="M36 98 V34 L48 34 L58 20 L69 32 L78 24 L92 38 C98 44 100 52 98 60 C95 70 86 76 72 76 H54 V98 H36 Z"
    fill="url(#cs2Gold)"
  />

  <!-- Snow-Capped Mountain Ridge Highlight -->
  <path
    d="M48 34 L58 20 L69 32 L78 24 L89 35 L78 36 L69 42 L59 31 L51 39 Z"
    fill="url(#icePeak)"
    opacity="0.95"
  />

  <!-- Inner 'P' Bowl Cutout with CS2 Crosshair Reticle -->
  <circle cx="71" cy="54" r="12" fill="#090e1a" />
  <circle cx="71" cy="54" r="7.5" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" />
  <line x1="71" y1="43" x2="71" y2="49" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  <line x1="71" y1="59" x2="71" y2="65" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  <line x1="60" y1="54" x2="66" y2="54" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  <line x1="76" y1="54" x2="82" y2="54" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  <circle cx="71" cy="54" r="1.6" fill="#fbbf24" />

  <!-- Protutech Circuit Traces on Vertical Stem -->
  <path d="M41 96 V76 L46 71 V62" stroke="#090e1a" stroke-width="2" stroke-linecap="round" />
  <circle cx="46" cy="61" r="2.2" fill="#090e1a" stroke="#38bdf8" stroke-width="1" />
  <path d="M48 96 V82 L52 78" stroke="#090e1a" stroke-width="2" stroke-linecap="round" />
  <circle cx="52" cy="77" r="2" fill="#090e1a" stroke="#f8fafc" stroke-width="1" />

  <!-- CS2 Tactical Micro-Badge -->
  <rect x="64" y="84" width="38" height="17" rx="5.5" fill="#090e1a" stroke="url(#cs2Gold)" stroke-width="1.5" />
  <text
    x="83"
    y="95.5"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="10.5"
    letter-spacing="0.8"
    fill="#fbbf24"
  >
    CS2
  </text>
</svg>
