<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="CS2 Utility Default Preview">
  <defs>
    <pattern id="tactical-grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162032" stroke-width="1" />
    </pattern>
    <pattern id="tactical-grid-major" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="url(#tactical-grid-minor)" />
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#1e293b" stroke-width="1.25" />
    </pattern>
    <radialGradient id="slate-vignette" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#131b2c" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Dark Slate Tactical Grid Background -->
  <rect width="600" height="360" fill="#0b0f19" />
  <rect width="600" height="360" fill="url(#tactical-grid-major)" />
  <rect width="600" height="360" fill="url(#slate-vignette)" />

  <!-- Subtle Tactical Frame & Corner Brackets -->
  <rect x="16" y="16" width="568" height="328" rx="10" fill="none" stroke="#1e293b" stroke-width="1" />
  <g stroke="#475569" stroke-width="1.5" fill="none" opacity="0.65">
    <path d="M 16 36 L 16 16 L 36 16" />
    <path d="M 564 16 L 584 16 L 584 36" />
    <path d="M 16 324 L 16 344 L 36 344" />
    <path d="M 564 344 L 584 344 L 584 324" />
  </g>

  <!-- Subtle Slot Pedestals -->
  <g fill="#0f172a" fill-opacity="0.55" stroke="#1e293b" stroke-width="1">
    <rect x="38" y="64" width="96" height="202" rx="10" />
    <rect x="145" y="64" width="96" height="202" rx="10" />
    <rect x="252" y="64" width="96" height="202" rx="10" />
    <rect x="359" y="64" width="96" height="202" rx="10" />
    <rect x="466" y="64" width="96" height="202" rx="10" />
  </g>

  <!-- 1. SMOKE GRENADE (center x=86) -->
  <g transform="translate(86, 158)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pull Ring -->
    <circle cx="-17" cy="-46" r="8" fill="none" stroke="#94a3b8" stroke-width="2.4" />
    <!-- Top Fuze Head -->
    <rect x="-11" y="-56" width="22" height="14" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="-6" y="-62" width="12" height="7" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Spoon Lever -->
    <path d="M 10 -53 L 22 -47 L 25 22 L 19 24 L 17 -41 L 10 -45 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Canister Body -->
    <path d="M -22 -36 C -22 -41 -17 -43 -12 -43 L 12 -43 C 17 -43 22 -41 22 -36 L 22 46 C 22 51 17 54 12 54 L -12 54 C -17 54 -22 51 -22 46 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.8" />
    <!-- Bands -->
    <rect x="-22" y="-22" width="44" height="10" fill="#64748b" opacity="0.7" />
    <rect x="-22" y="20" width="44" height="10" fill="#64748b" opacity="0.7" />
    <line x1="-22" y1="-22" x2="22" y2="-22" stroke="#94a3b8" stroke-width="1.2" opacity="0.6" />
    <line x1="-22" y1="30" x2="22" y2="30" stroke="#94a3b8" stroke-width="1.2" opacity="0.6" />
    <text x="0" y="88" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.6">SMOKE</text>
  </g>

  <!-- 2. FLASHBANG (center x=193) -->
  <g transform="translate(193, 158)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pull Ring -->
    <circle cx="-15" cy="-46" r="7.5" fill="none" stroke="#94a3b8" stroke-width="2.4" />
    <!-- Top Fuze -->
    <rect x="-9" y="-56" width="18" height="13" rx="2.5" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="-5" y="-62" width="10" height="7" rx="1.5" fill="#475569" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Lever -->
    <path d="M 9 -52 L 19 -46 L 22 18 L 16 19 L 14 -41 L 9 -45 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Stepped Flash Body -->
    <rect x="-18" y="-42" width="36" height="11" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="1.6" />
    <rect x="-15" y="-31" width="30" height="72" fill="#475569" stroke="#94a3b8" stroke-width="1.8" />
    <rect x="-18" y="41" width="36" height="12" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="1.6" />
    <!-- Flash Vents -->
    <g fill="#0b0f19" stroke="#94a3b8" stroke-width="1">
      <circle cx="-6" cy="-12" r="3" />
      <circle cx="6" cy="-12" r="3" />
      <circle cx="-6" cy="5" r="3" />
      <circle cx="6" cy="5" r="3" />
      <circle cx="-6" cy="22" r="3" />
      <circle cx="6" cy="22" r="3" />
    </g>
    <text x="0" y="88" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.6">FLASH</text>
  </g>

  <!-- 3. MOLOTOV (center x=300) -->
  <g transform="translate(300, 158)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-8)">
      <!-- Rag Wick / Flame Silhouette -->
      <path d="M -5 -49 C -10 -61 -2 -69 4 -65 C 8 -72 15 -66 11 -55 C 16 -53 13 -45 6 -45 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Bottle Neck & Collar -->
      <path d="M -7 -47 L 7 -47 L 8 -23 C 8 -16 20 -11 20 0 L 20 46 C 20 52 16 55 10 55 L -10 55 C -16 55 -20 52 -20 46 L -20 0 C -20 -11 -8 -16 -8 -23 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.8" />
      <!-- Cloth Wrap Around Neck -->
      <rect x="-9" y="-45" width="18" height="10" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="1.4" />
      <!-- Fuel Fill Line & Label -->
      <path d="M -18 14 Q 0 19 18 14 L 18 46 C 18 50 14 52 10 52 L -10 52 C -14 52 -18 50 -18 46 Z" fill="#64748b" opacity="0.65" />
      <line x1="-18" y1="14" x2="18" y2="14" stroke="#94a3b8" stroke-width="1.3" opacity="0.7" />
    </g>
    <text x="0" y="88" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.6">MOLOTOV</text>
  </g>

  <!-- 4. HE GRENADE (center x=407) -->
  <g transform="translate(407, 158)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pull Ring -->
    <circle cx="-15" cy="-42" r="7.5" fill="none" stroke="#94a3b8" stroke-width="2.4" />
    <!-- Top Fuze -->
    <rect x="-9" y="-54" width="18" height="14" rx="2.5" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="-5" y="-60" width="10" height="7" rx="1.5" fill="#475569" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Spoon Lever -->
    <path d="M 9 -50 L 21 -43 C 26 -24 27 0 24 20 L 18 20 C 20 1 19 -20 15 -38 L 9 -42 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Oval Fragmentation Body -->
    <path d="M 0 -41 C 17 -41 25 -22 25 6 C 25 35 16 53 0 53 C -16 53 -25 35 -25 6 C -25 -22 -17 -41 0 -41 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.8" />
    <!-- Fragmentation Grid Grooves -->
    <g stroke="#94a3b8" stroke-width="1.2" opacity="0.55" fill="none">
      <line x1="-22" y1="-15" x2="22" y2="-15" />
      <line x1="-24" y1="6" x2="24" y2="6" />
      <line x1="-22" y1="27" x2="22" y2="27" />
      <path d="M 0 -41 L 0 53" />
      <path d="M -11 -36 C -15 -10 -15 22 -10 49" />
      <path d="M 11 -36 C 15 -10 15 22 10 49" />
    </g>
    <text x="0" y="88" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.6">HE NADE</text>
  </g>

  <!-- 5. DECOY (center x=514) -->
  <g transform="translate(514, 158)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pull Ring -->
    <circle cx="-15" cy="-42" r="7" fill="none" stroke="#94a3b8" stroke-width="2.4" />
    <!-- Top Fuze -->
    <rect x="-8" y="-52" width="16" height="12" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="-5" y="-58" width="10" height="7" rx="1.5" fill="#475569" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Lever -->
    <path d="M 8 -48 L 19 -42 L 21 15 L 15 16 L 13 -37 L 8 -41 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.4" />
    <!-- Compact Ribbed Body -->
    <path d="M -17 -38 L 17 -38 L 19 -28 L 19 41 L 16 52 L -16 52 L -19 41 L -19 -28 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.8" />
    <rect x="-19" y="-12" width="38" height="24" fill="#64748b" opacity="0.65" />
    <g stroke="#94a3b8" stroke-width="1.2" opacity="0.6">
      <line x1="-19" y1="-12" x2="19" y2="-12" />
      <line x1="-19" y1="0" x2="19" y2="0" />
      <line x1="-19" y1="12" x2="19" y2="12" />
    </g>
    <text x="0" y="88" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.6">DECOY</text>
  </g>

  <!-- Bottom Label -->
  <g transform="translate(300, 314)">
    <rect x="-136" y="-14" width="272" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9" />
    <text x="0" y="2" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="2.2">CS2 UTILITY // DEFAULT PREVIEW</text>
  </g>
</svg>
