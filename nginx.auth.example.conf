# ==============================================================================
# Protutech Production Nginx Configuration with HTTP Basic Authentication Gate
# ==============================================================================
# This configuration secures the application at the network/web-server layer.
# Unauthorized visitors receive a 401 Unauthorized before any HTML or JS is sent.
#
# To generate the password credentials file:
#   sudo apt install apache2-utils (on Debian/Ubuntu)
#   sudo htpasswd -c /etc/nginx/.htpasswd admin
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # --------------------------------------------------------------------------
    # PASSWORD AUTHENTICATION GATE (Server-Side Perimeter Protection)
    # --------------------------------------------------------------------------
    auth_basic "Protutech Protected Application";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Static assets with cache headers
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend Express/WebSocket API
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
