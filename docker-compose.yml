version: '3.8'

services:
  backend:
    build: ./backend
    container_name: cs2-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  frontend:
    build: ./frontend
    container_name: cs2-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pb_data: