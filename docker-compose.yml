version: '3.8'

services:
  backend:
    image: pocketbase/pocketbase:latest
    container_name: cs2-backend
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - pb_data:/pb_data

  frontend:
    build: ./frontend
    container_name: cs2-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_PB_URL=http://localhost:8090
    depends_on:
      - backend

volumes:
  pb_data: