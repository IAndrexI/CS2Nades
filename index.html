<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080c16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CS2 Stratbook" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protutech CS2 Tactical Stratbook & Nade Lineups</title>
    <script>
      console.log(
        "%c PROTUTECH CS2 STRATBOOK %c v2.1 %c",
        "background: #00f2fe; color: #080c16; font-weight: 800; padding: 4px 8px; border-radius: 4px 0 0 4px;",
        "background: #7f00ff; color: #ffffff; font-weight: 700; padding: 4px 8px; border-radius: 0 4px 4px 0;",
        ""
      );
      console.log(
        "%c[Theme Update]%c Synced with Protutech Suite Themes (Obsidian, Adobe Classic, Cyber Emerald, Sunset Ember)\n%c[Changelog]%c Integrated unified suite design tokens & automated LXC GitOps sync.",
        "color: #00f2fe; font-weight: bold;", "color: #f8fafc;",
        "color: #7f00ff; font-weight: bold;", "color: #94a3b8;"
      );
      try {
        const savedTheme = localStorage.getItem('protutech_theme_mode') || 'dark';
        const savedPalette = localStorage.getItem('protutech_theme_palette') || 'protutech-obsidian';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-palette', savedPalette);
        if (savedTheme === 'light') document.documentElement.classList.add('light-theme');
        if (savedPalette) document.documentElement.classList.add('palette-' + savedPalette);
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 select-none">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
